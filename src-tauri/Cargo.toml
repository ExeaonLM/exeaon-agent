[package]
name = "exeaon_claw"
version = "1.15.0"
description = "Exeaon Claw - Native AI Agent Desktop Interface"
authors = ["Exeaon Team"]
edition = "2021"
rust-version = "1.77.2"

# This directory is its own workspace root; without this, cargo walks up and
# picks up an unrelated workspace manifest in a parent directory.
[workspace]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# In-app updates from GitHub Releases (signed). The updater fetches latest.json
# from the repo's releases, verifies the signature against the pubkey in
# tauri.conf.json, downloads + installs; the process plugin relaunches.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
